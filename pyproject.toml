[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bria"
version = "0.1.0"
description = "BRanch–Inspect–Adopt for retrieval-augmented tool use"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{name = "Megagon Labs, Inc."}]
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.24,<3",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
qwen = ["sentence-transformers>=3.0", "transformers>=4.51,<6", "torch>=2.1"]
faiss = ["faiss-cpu>=1.8"]
mcp-data = ["pyarrow>=17.0"]

[project.scripts]
bria = "bria.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bria"]

[tool.hatch.build.targets.sdist]
include = ["src/bria", "assets", "bria.yaml", "README.md", "LICENSE", "pyproject.toml", "requirements.txt", ".gitignore"]
